<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Engine Harness (dev only)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080D16; overflow: hidden; }
    #stage { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; cursor: grab; }
    #hint {
      position: fixed; left: 12px; top: 10px; z-index: 10;
      font: 600 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #9aa4b2; background: rgba(8,13,22,.85); border: 1px solid #1e2735;
      border-radius: 6px; padding: 8px 10px; user-select: none;
    }
    #hint b { color: #e8eef6; }
    #hint button {
      font: inherit; color: #e8eef6; background: #16202f; border: 1px solid #24304a;
      border-radius: 4px; padding: 1px 8px; margin: 2px 4px 2px 0; cursor: pointer;
    }
    #hint button.active { background: #24406b; border-color: #3d6bb5; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hint">
    <b>office engine harness</b> — dev only<br>
    <button id="btn-pause">⏸ 0×</button><button id="btn-1x" class="active">▶ 1×</button><button id="btn-3x">▶▶ 3×</button>
    <button id="btn-nav">navdebug: off</button><br>
    drag = pan · wheel = zoom · N = navdebug
  </div>
  <script type="module" src="/src/game/harness/main.ts"></script>
</body>
</html>
