[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "1.0.0"
description = "Governance and observability control plane for AI coding agents"
requires-python = ">=3.11"
# Runtime pins live in requirements.txt, which is the frozen, reproducible set.
# Listing them twice would let the two drift.
dependencies = []

[tool.setuptools.packages.find]
include = ["agentshield*"]

# ──────────────────────────────────────────────────────────────────────
# Lint
# ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "ASYNC",     # async correctness
    "S",         # flake8-bandit
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",
]
ignore = [
    "S101",    # assert: the test suites are the enforcement mechanism here
    "B008",    # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# The vendor ban below exists to keep SDKs OUT of domain code. The adapters
# are where they belong, so the rule is lifted for exactly those two packages
# and for the contract fixtures, which must build moto resources directly.
"agentshield/adapters/aws/**" = ["TID251"]
"agentshield/adapters/local/**" = ["TID251"]
"tests/contract/**" = ["TID251", "S105", "S106", "S311"]

# Detector regexes and seeded fixtures trip the secret scanners by design.
"agentshield/governance/redaction.py" = ["S105", "S106", "E501"]
"agentshield/sim/seed.py" = ["S105", "S106", "E501"]
"tests/**" = ["S105", "S106", "S311"]

# `random` is used deliberately throughout the simulator -- always seeded from
# `run.seed`, never for anything security-bearing. S311 would flag every draw.
"agentshield/adapters/local/mock_llm.py" = ["S311"]
"agentshield/adapters/aws/bedrock_llm.py" = ["S311"]
"agentshield/sim/**" = ["S311"]
"agentshield/sandbox/**" = ["S311"]

# Generated from packages/contracts/events.schema.json -- never hand-edited,
# so line length here reflects the schema's field lists, not a style choice.
"agentshield/domain/generated_events.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The ports boundary, stated once in config and asserted in
# tests/test_architecture.py. Two independent guards, because this is the
# invariant the whole AWS migration rests on.
"boto3".msg = "Vendor SDKs belong in adapters/aws/. Domain code uses a port."
"aioboto3".msg = "Vendor SDKs belong in adapters/aws/. Domain code uses a port."
"sqlite3".msg = "Storage drivers belong in adapters/local/. Use DocStorePort."
"aiosqlite".msg = "Storage drivers belong in adapters/local/. Use DocStorePort."

[tool.ruff.format]
quote-style = "double"

# ──────────────────────────────────────────────────────────────────────
# Types
# ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*", "sklearn.*", "ulid.*", "pytest_benchmark.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────
# Tests
# ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Our own deprecations are errors -- that is the point of the setting.
    "error::DeprecationWarning",
    # Debt inside the pinned third-party set must not be able to fail our
    # suites. Each entry is a specific library on a specific pinned version,
    # never a blanket ignore:
    #   boto3 1.35        -- calls datetime.utcnow(), deprecated in 3.12
    #   starlette 0.46    -- imports the deprecated anyio.abc.BlockingPortal
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:boto3.*",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "contract: runs against both adapter sets",
    "slow: excluded from the pre-commit run",
]
